name: Deploy to GitHub Pages

'on':
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: localcricket/package-lock.json

      - name: Install dependencies
        working-directory: localcricket
        run: npm ci

      - name: Run automated tests
        working-directory: localcricket
        run: npm test

      - name: Run TypeScript verification
        working-directory: localcricket
        run: npm run lint

      - name: Build production app
        working-directory: localcricket
        run: npm run build

      - name: Verify build outputs
        run: |
          test -f localcricket/dist/index.html || { echo "Error: localcricket/dist/index.html missing"; exit 1; }
          test -f localcricket/dist/404.html || { echo "Error: localcricket/dist/404.html missing"; exit 1; }
          echo "Verified: index.html and 404.html present."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: localcricket/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
